<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HRIS Import Preview{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
           max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; color: #1f2430;
           line-height: 1.5; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    h2 { font-size: 17px; margin-top: 32px; border-bottom: 1px solid #e2e5ea;
         padding-bottom: 6px; }
    .muted { color: #6b7280; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 14px; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #ececf0;
             vertical-align: top; }
    th { background: #f6f7f9; font-weight: 600; }
    .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
    .stat { border: 1px solid #e2e5ea; border-radius: 8px; padding: 12px 16px;
            min-width: 130px; }
    .stat .num { font-size: 24px; font-weight: 600; }
    .stat .label { font-size: 12px; color: #6b7280; }
    .stat.bad .num { color: #b3261e; }
    .error-box { background: #fdecea; border: 1px solid #f2b8b5; color: #8c1d18;
                 padding: 12px 14px; border-radius: 8px; margin: 16px 0; }
    .none { color: #6b7280; font-style: italic; margin-top: 10px; }
    code { background: #f0f1f4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    a { color: #2f5fdb; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
